<!DOCTYPE html>
<html>
<head>
    <title>Cymatics Simulation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Previous styles remain the same */
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }
        canvas {
            border: 1px solid #333;
            margin: 10px;
            max-width: 100%;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 10px;
            padding: 15px;
            background: #333;
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
        }
        .control-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        input[type="range"] {
            width: 60%;
        }
        select {
            padding: 5px;
            background: #444;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
            width: 60%;
        }
        label {
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h2>GeoCymatics</h2>
    <canvas id="canvas"></canvas>
    <div class="controls">
        <div class="control-group">
            <label>Geometry:</label>
            <select id="geometry">
                <option value="circular">Circular</option>
                <option value="square">Square</option>
                <option value="triangle">Triangle</option>
                <option value="spiral">Spiral</option>
                <option value="star">Star</option>
                <option value="flower">Flower</option>
            </select>
        </div>
        <div class="control-group">
            <label>Speed:</label>
            <input type="range" id="frequency" min="1" max="20" value="5" step="0.5">
            <span id="freqValue">5</span>
        </div>
        <div class="control-group">
            <label>Wave Size:</label>
            <input type="range" id="amplitude" min="1" max="50" value="20">
            <span id="ampValue">20</span>
        </div>
        <div class="control-group">
            <label>Particles:</label>
            <input type="range" id="particles" min="100" max="2000" value="1000" step="100">
            <span id="particleValue">1000</span>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            const size = Math.min(window.innerWidth - 40, 500);
            canvas.width = size;
            canvas.height = size;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const densityCanvas = document.createElement('canvas');
        const densityCtx = densityCanvas.getContext('2d');
        densityCanvas.width = canvas.width;
        densityCanvas.height = canvas.height;

        class Particle {
            constructor() {
                this.reset();
                this.color = this.getRandomColor();
            }

            reset() {
                // Start from center
                this.x = canvas.width / 2;
                this.y = canvas.height / 2;
                // Random angle for initial direction
                this.angle = Math.random() * Math.PI * 2;
                // Distance from center (starts at 0)
                this.distance = 0;
                // Random speed variation
                this.speed = Math.random() * 2 + 0.5;
                // Whether particle should be reset
                this.active = true;
                // Random size variation
                this.size = Math.random() * 2 + 1;
            }

            getRandomColor() {
                const colors = [
                    'rgba(255, 0, 0, 0.3)',
                    'rgba(0, 255, 0, 0.3)',
                    'rgba(0, 0, 255, 0.3)'
                ];
                return colors[Math.floor(Math.random() * colors.length)];
            }

            draw() {
                const alpha = Math.max(0, 1 - this.distance / (canvas.width / 2));
                const color = this.color.replace('0.3', alpha * 0.3);
                
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fill();

                densityCtx.globalCompositeOperation = 'lighter';
                densityCtx.fillStyle = color;
                densityCtx.beginPath();
                densityCtx.arc(this.x, this.y, this.size * 2, 0, Math.PI * 2);
                densityCtx.closePath();
                densityCtx.fill();
            }

            update(frequency, amplitude, time, geometry) {
                if (!this.active) {
                    this.reset();
                    return;
                }

                // Base movement from center
                this.distance += this.speed * (frequency / 5);

                switch(geometry) {
                    case 'circular':
                        this.x = canvas.width/2 + Math.cos(this.angle) * this.distance;
                        this.y = canvas.height/2 + Math.sin(this.angle) * this.distance;
                        break;

                    case 'square':
                        const squareAngle = Math.round(this.angle / (Math.PI/2)) * (Math.PI/2);
                        this.x = canvas.width/2 + Math.cos(squareAngle) * this.distance;
                        this.y = canvas.height/2 + Math.sin(squareAngle) * this.distance;
                        break;

                    case 'triangle':
                        const triangleAngle = Math.round(this.angle / (Math.PI*2/3)) * (Math.PI*2/3);
                        this.x = canvas.width/2 + Math.cos(triangleAngle) * this.distance;
                        this.y = canvas.height/2 + Math.sin(triangleAngle) * this.distance;
                        break;

                    case 'spiral':
                        const spiralGrowth = 0.1;
                        this.angle += 0.1;
                        this.x = canvas.width/2 + Math.cos(this.angle) * this.distance;
                        this.y = canvas.height/2 + Math.sin(this.angle) * this.distance;
                        break;

                    case 'star':
                        const points = 5;
                        const starAngle = Math.round(this.angle / (Math.PI*2/points)) * (Math.PI*2/points);
                        const waveFactor = Math.sin(starAngle * points) * 0.3 + 1;
                        this.x = canvas.width/2 + Math.cos(this.angle) * (this.distance * waveFactor);
                        this.y = canvas.height/2 + Math.sin(this.angle) * (this.distance * waveFactor);
                        break;

                    case 'flower':
                        const petals = 6;
                        const petalFactor = Math.cos(this.angle * petals) * 0.5 + 1;
                        this.x = canvas.width/2 + Math.cos(this.angle) * (this.distance * petalFactor);
                        this.y = canvas.height/2 + Math.sin(this.angle) * (this.distance * petalFactor);
                        break;
                }

                // Add wave motion
                const wave = Math.sin(this.distance * 0.05 + time) * amplitude;
                this.x += Math.cos(this.angle) * wave;
                this.y += Math.sin(this.angle) * wave;

                // Reset particle if it goes off screen
                const maxDistance = Math.max(canvas.width, canvas.height);
                if (this.distance > maxDistance) {
                    this.active = false;
                }
            }
        }

        let particles = [];
        function initParticles(count) {
            particles = [];
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }

        let time = 0;
        let frequency = 5;
        let amplitude = 20;
        let particleCount = 1000;
        let currentGeometry = 'circular';

        function updateUIValues() {
            document.getElementById('freqValue').textContent = frequency;
            document.getElementById('ampValue').textContent = amplitude;
            document.getElementById('particleValue').textContent = particleCount;
        }

        // Event listeners remain the same
        document.getElementById('geometry').addEventListener('change', (e) => {
            currentGeometry = e.target.value;
        });

        document.getElementById('frequency').addEventListener('input', (e) => {
            frequency = parseFloat(e.target.value);
            updateUIValues();
        });

        document.getElementById('amplitude').addEventListener('input', (e) => {
            amplitude = parseFloat(e.target.value);
            updateUIValues();
        });

        document.getElementById('particles').addEventListener('input', (e) => {
            particleCount = parseInt(e.target.value);
            initParticles(particleCount);
            updateUIValues();
        });

        function animate() {
            ctx.fillStyle = 'rgba(26, 26, 26, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            densityCtx.clearRect(0, 0, densityCanvas.width, densityCanvas.height);

            particles.forEach(particle => {
                particle.update(frequency, amplitude, time, currentGeometry);
                particle.draw();
            });

            ctx.globalCompositeOperation = 'lighter';
            ctx.drawImage(densityCanvas, 0, 0);
            ctx.globalCompositeOperation = 'source-over';

            time += 0.05;
            requestAnimationFrame(animate);
        }

        initParticles(particleCount);
        updateUIValues();
        animate();
    </script>
</body>
</html>
